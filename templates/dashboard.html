<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ClaimFlux SA Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:#f5f7fb;
    color:#111827;
}

.container{
    width:95%;
    max-width:1400px;
    margin:auto;
}

header{
    background:white;
    padding:20px 0;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

header .container{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:28px;
    font-weight:700;
    color:#2563eb;
}

.email{
    color:#6b7280;
    font-size:14px;
}

.page-title{
    margin-top:40px;
}

.page-title h1{
    font-size:36px;
}

.page-title p{
    color:#6b7280;
    margin-top:8px;
}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-top:30px;
}

.card{
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.card h3{
    color:#6b7280;
    font-size:15px;
    margin-bottom:15px;
}

.card h1{
    font-size:36px;
}

.green{
    color:#10b981;
}

.orange{
    color:#f59e0b;
}

.red{
    color:#ef4444;
}

.section{
    margin-top:40px;
}

.section h2{
    margin-bottom:20px;
}

.claim-card{
    background:white;
    border-radius:20px;
    padding:25px;
    margin-bottom:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.claim-card h3{
    margin-bottom:15px;
}

.claim-card p{
    color:#6b7280;
    margin-bottom:10px;
}

.badge{
    display:inline-block;
    padding:8px 14px;
    border-radius:20px;
    color:white;
    font-size:13px;
    font-weight:600;
}

.badge.orange{
    background:#f59e0b;
}

.badge.green{
    background:#10b981;
}

.badge.red{
    background:#ef4444;
}

.badge.gray{
    background:#6b7280;
}

.alert-card{
    background:#fff7ed;
    border-left:5px solid orange;
    padding:20px;
    border-radius:12px;
    margin-bottom:15px;
}

.empty{
    background:white;
    padding:40px;
    text-align:center;
    border-radius:20px;
    color:#9ca3af;
}

.loading{
    text-align:center;
    padding:50px;
    color:#6b7280;
}

@media(max-width:768px){

.page-title h1{
    font-size:28px;
}

.card h1{
    font-size:28px;
}

}

</style>
</head>

<body>

<header>

<div class="container">

<div class="logo">
ClaimFlux SA
</div>

<div class="email" id="userEmail">
Loading...
</div>

</div>

</header>

<div class="container">

<div class="page-title">

<h1>Dashboard</h1>

<p>
Track claims, warranties and CPA alerts.
</p>

</div>

<div class="stats-grid">

<div class="card">

<h3>Total Claims</h3>

<h1 id="claimCount">0</h1>

</div>

<div class="card">

<h3>Active Claims</h3>

<h1 class="orange" id="activeClaims">
0
</h1>

</div>

<div class="card">

<h3>Total Recovered</h3>

<h1 class="green" id="totalRecovered">
R0
</h1>

</div>

<div class="card">

<h3>Urgent Alerts</h3>

<h1 class="red" id="urgentCount">
0
</h1>

</div>

</div>

<div class="section">

<h2>CPA Alerts</h2>

<div id="alertsContainer">

<div class="empty">
No alerts
</div>

</div>

</div>

<div class="section">

<h2>Your Claims</h2>

<div id="claimsContainer">

<div class="loading">

Loading claims...

</div>

</div>

</div>

</div>

<script>

function getStatusColor(status){

status=status.toLowerCase();

if(status==="paid") return "green";

if(status==="initiated") return "orange";

if(status==="rejected") return "red";

return "gray";

}

function renderClaims(claims){

let html="";

if(claims.length===0){

html=`
<div class="empty">

No claims found.

</div>
`;

document.getElementById("claimsContainer").innerHTML=html;

return;

}

claims.forEach(claim=>{

html+=`

<div class="claim-card">

<h3>
${claim.product_name || "Product"}
</h3>

<p>

Issue:

${claim.issue_description || "N/A"}

</p>

<p>

Status:

<span class="badge ${getStatusColor(claim.status)}">

${claim.status}

</span>

</p>

<p>

Amount:

R${claim.claim_amount || 0}

</p>

</div>

`;

});

document.getElementById("claimsContainer").innerHTML=html;

}

function renderAlerts(alerts){

let html="";

if(alerts.length===0){

html=`

<div class="empty">

No CPA alerts.

</div>

`;

document.getElementById("alertsContainer").innerHTML=html;

return;

}

alerts.forEach(alert=>{

html+=`

<div class="alert-card">

<strong>

${alert.product_name}

</strong>

<br><br>

${alert.message}

</div>

`;

});

document.getElementById("alertsContainer").innerHTML=html;

}

const params=new URLSearchParams(window.location.search);

const email=params.get("email");

document.getElementById("userEmail").innerText=email || "";

fetch("/api/my-claims?email="+email)

.then(response=>response.json())

.then(data=>{

document.getElementById("claimCount").innerText=
data.count;

document.getElementById("activeClaims").innerText=
data.active_claims;

document.getElementById("totalRecovered").innerText=
"R"+data.total_recovered;

document.getElementById("urgentCount").innerText=
data.urgent_count;

renderClaims(data.claims);

renderAlerts(data.cpa_alerts);

})

.catch(error=>{

document.getElementById("claimsContainer").innerHTML=`

<div class="empty">

Failed to load claims.

</div>

`;

});

</script>

</body>
</html>
